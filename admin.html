<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área comercial | Doni Transportes</title>
<style>
:root{color-scheme:dark;font:16px 'Segoe UI',sans-serif;color:#eee;background:#0f0f0f}*{box-sizing:border-box}body{margin:0}header{border-bottom:2px solid #00ff66;padding:22px 6%;display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{color:#00ff66}a{color:#00ff66}main{max-width:1160px;margin:42px auto;padding:0 24px}h1{font-size:2rem;margin-bottom:10px}p{color:#bbb;line-height:1.6}section{border:1px solid #333;border-radius:12px;padding:28px;background:#161616}.login{max-width:480px;margin:60px auto}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;padding:12px;border-radius:6px;border:1px solid #555;background:#222;color:white}input{width:100%}button{cursor:pointer;background:#00ff66;color:#080808;font-weight:650;border:0}button:disabled{opacity:.5;cursor:wait}.login button{margin-top:22px;width:100%}[hidden]{display:none!important}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}.toolbar span{margin-right:auto}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:16px 10px;border-bottom:1px solid #333;vertical-align:top}th{color:#aaa;font-size:.875rem}td small{display:block;color:#aaa;margin-top:6px;font-size:.875rem}td a{display:inline-block;margin:5px 0}td select{max-width:170px}.status{padding:14px;border:1px solid #555;border-radius:6px;overflow-wrap:anywhere}.status:empty{display:none}.error{color:#ffc8c8;border-color:#aa5050}.success{color:#b9ffd4;border-color:#2e8050}td button{margin-top:8px;padding:9px 14px}.empty{text-align:center;padding:40px;color:#bbb}.pager{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:24px}button.secondary{background:#292929;color:#eee;border:1px solid #555}@media(max-width:600px){main{padding:0 14px;margin:24px auto}section{padding:18px}h1{font-size:1.6rem}header{padding:18px}.login{margin:24px auto}}
</style><link rel="stylesheet" href="branding.css">
</head>
<body><header><div class="brand-group"><a class="brand-link" href="index.html" aria-label="Doni Transportes — início"><img class="brand-logo" src="logo-doni.jpeg" alt="Doni Transportes" width="1600" height="1070"></a><span>Comercial</span></div><a href="index.html">Voltar ao site</a></header>
<main>
<section id="login-panel" class="login"><h1>Acesso da equipe</h1><p>Entre para consultar e acompanhar as solicitações de orçamento.</p>
<form id="login-form"><label for="operator-email">E-mail</label><input id="operator-email" name="email" type="email" autocomplete="username" required maxlength="254"><label for="operator-password">Senha</label><input id="operator-password" name="senha" type="password" autocomplete="current-password" required maxlength="128"><button type="submit">Entrar</button></form></section>
<section id="dashboard" hidden><h1>Solicitações de orçamento</h1><p>Consulte os pedidos recebidos e acompanhe o atendimento.</p>
<div class="toolbar"><span id="operator"></span><label for="status-filter" style="margin:0">Status</label><select id="status-filter"><option value="">Todos</option><option>RECEBIDA</option><option>EM_ANALISE</option><option>COTADA</option><option>CANCELADA</option></select><button id="refresh" type="button" class="secondary">Atualizar</button><button id="logout" type="button" class="secondary">Sair</button></div>
<div class="table-wrap"><table><thead><tr><th>Pedido e cliente</th><th>Rota e carga</th><th>Contato</th><th>Atendimento</th></tr></thead><tbody id="orders"></tbody></table></div>
<div class="pager"><button id="previous" type="button" class="secondary">Anterior</button><span id="pagination"></span><button id="next" type="button" class="secondary">Próxima</button></div></section>
<p id="feedback" class="status" role="status" aria-live="polite"></p>
</main><script src="admin.js" defer></script></body></html>
