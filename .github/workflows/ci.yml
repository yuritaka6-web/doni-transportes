name: Contrato e testes Python
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/api/requirements.txt
      - run: pip install -r src/api/requirements.txt
      - run: python scripts/export_contract.py
      - run: git diff --exit-code docs/openapi-v2.json
      - run: python -m pytest
